<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" href="./favicon.png" />
    <link rel="stylesheet" href="./src/index.css" />
    <link rel="stylesheet" href="./src/app.css" />
    <title>Product details — Demo Store</title>
  </head>

  <body>
    <header class="header">
      <h1 class="header-title"><a href="./instantsearch.html">Demo Store</a></h1>
      <p class="header-subtitle">Product details</p>
    </header>

    <main class="container product-page">
      <a class="back-link" href="./instantsearch.html">← Back to search</a>

      <article class="product-detail">
        <section class="product-gallery">
          <img class="product-image" src="" alt="" hidden />
        </section>

        <section>
          <p class="product-eyebrow" data-product-brand></p>
          <h2 class="product-title" data-product-name>Loading product…</h2>
          <p class="product-price" data-product-price></p>
          <p class="product-categories" data-product-categories></p>
          <p class="product-description" data-product-description></p>
          <a class="product-source-link" data-product-source hidden target="_blank" rel="noreferrer">
            View original listing
          </a>

          <button class="product-add-button" type="button" disabled>Add to cart</button>
          <p class="product-note">This is a demo product page. No purchase will be made.</p>
        </section>
      </article>
    </main>
    <script type="module" src="./src/product.js"></script>
  </body>
</html>
